name: Build CubeBrowser (libogc2)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the source code
        uses: actions/checkout@v5

      - name: Download mbedTLS
        run: sh get-mbedtls.sh

      - name: Build the Game Boy Advance music player
        run: docker run --rm -v "$PWD:/src" -w /src/gba devkitpro/devkitarm:latest make

      - name: Put the music player into the browser
        run: python3 tools/bin2c.py gba/gbaplayer_mb.gba source/gbaplayer_rom.c gbaplayer_rom

      - name: Build the .dol
        run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/extremscorner/libogc2:latest make

      - name: Gather files for the SD card
        run: |
          # the app's folder for the card (it goes in sd:/apps): the browser
          # as default.dol, its banner, and the data folder
          mkdir -p package/cubebrowser
          cp cubebrowser.dol package/cubebrowser/default.dol
          cp dist/opening.bnr package/cubebrowser/
          cp -r sd/gcbrowser package/cubebrowser/

      - name: Upload result
        uses: actions/upload-artifact@v6
        with:
          name: cubebrowser
          path: package/
